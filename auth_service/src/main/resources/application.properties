spring.application.name=auth_service
server.port=8088

# =========================
# PostgreSQL
# =========================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/x_auth_db}
spring.datasource.username=${AUTH_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD:admin}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Redis
# =========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# =========================
# JWT
# =========================
jwt-secret=${JWT_SECRET:baygiobietphaidatnhuthenaodayhamoinguoi}
jwt-expiration=${JWT_EXPIRATION:900000}
jwt-refresh-expired=${JWT_REFRESH_EXPIRATION:604800000}

logging.level.org.springframework.security=TRACE

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always