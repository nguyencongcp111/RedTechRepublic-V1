events {}

http {
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=20r/s;

    upstream product_service {
        server product-service:8081;
    }

    upstream inventory_service {
        server inventory-service:8082;
    }

    upstream order_service {
        server order-service:8083;
    }

    upstream payment_service {
        server payment-service:8084;
    }

    server {
        listen 80;
        client_max_body_size 1m;

        location /api/products {
            limit_req zone=api_rate_limit burst=40 nodelay;

            proxy_pass http://product_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/inventory {
            limit_req zone=api_rate_limit burst=80 nodelay;

            proxy_pass http://inventory_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/orders {
            limit_req zone=api_rate_limit burst=80 nodelay;

            proxy_pass http://order_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/payments {
            limit_req zone=api_rate_limit burst=40 nodelay;

            proxy_pass http://payment_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}