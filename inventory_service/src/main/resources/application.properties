spring.application.name=inventory_service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${INVENTORY_DB_URL:jdbc:postgresql://postgres:5432/x_inventory_db}
spring.datasource.username=${INVENTORY_DB_USERNAME:postgres}
spring.datasource.password=${INVENTORY_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
spring.mvc.problemdetails.enabled=true
