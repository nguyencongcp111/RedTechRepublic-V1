spring.application.name=payment_service
server.port=${SERVER_PORT:8084}

spring.datasource.url=${PAYMENT_DB_URL:jdbc:postgresql://postgres:5432/x_payment_db}
spring.datasource.username=${PAYMENT_DB_USERNAME:postgres}
spring.datasource.password=${PAYMENT_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
spring.mvc.problemdetails.enabled=true

services.order.base-url=${ORDER_SERVICE_URL:http://127.0.0.1:8083}

spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
