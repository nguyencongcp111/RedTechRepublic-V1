spring.application.name=product_service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${PRODUCT_DB_URL:jdbc:postgresql://postgres:5432/x_product_db}
spring.datasource.username=${PRODUCT_DB_USERNAME:postgres}
spring.datasource.password=${PRODUCT_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
spring.mvc.problemdetails.enabled=true
