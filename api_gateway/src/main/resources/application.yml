server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: auth-service
              uri: http://auth-service:8088
              predicates:
                - Path=/api/auth/**

            - id: product-service
              uri: http://product-service:8081
              predicates:
                - Path=/api/products/**

            - id: category-service
              uri: http://product-service:8081
              predicates:
                - Path=/api/category,/api/category/**

            - id: inventory-service
              uri: http://inventory-service:8082
              predicates:
                - Path=/api/inventory/**

            - id: order-service
              uri: http://order-service:8083
              predicates:
                - Path=/api/orders/**

            - id: payment-service
              uri: http://payment-service:8084
              predicates:
                - Path=/api/payments/**
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
