name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service-build:
    strategy:
      fail-fast: false
      matrix:
        service:
          - product_service
          - inventory_service
          - order_service
          - payment_service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Build container image
        run: docker build -t ecommerce/${{ matrix.service }}:${{ github.sha }} ${{ matrix.service }}

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
